[workspace]
name = "mario"
version = "0.1.0"
description = "RoboCup match analysis and commentary"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pytorch = {version = ">=2.5", channel = "pytorch"}
pytorch-cuda = {version = "12.4.*", channel = "pytorch"}
opencv = ">=4.9"
numpy = ">=1.26,<2"
pandas = ">=2.2"
scipy = ">=1.15"
scikit-learn = ">=1.7"
matplotlib = ">=3.10"
pillow = ">=10"
tqdm = ">=4.66"
pyyaml = ">=6.0"
flask = ">=3.0"
munch = ">=4.0"
requests = ">=2.32"
click = ">=7.1,<8.2"

[pypi-dependencies]
torchvision = ">=0.20"
ultralytics = ">=8.3"
openai = ">=1.40"
yt-dlp = ">=2025.1"
edge-tts = ">=6.1"
gTTS = ">=2.5"
pydub = ">=0.25"
ollama = "*"
lap = ">=0.5"
einops = ">=0.8"
timm = ">=1.0"
transformers = ">=4.48"
motmetrics = ">=1.4"
xmltodict = ">=0.14"
ipyfilechooser = ">=0.6"
javaobj-py3 = ">=0.6"
