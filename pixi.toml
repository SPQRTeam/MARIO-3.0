[workspace]
name = "mario"
version = "0.1.0"
description = "RoboCup match analysis and commentary"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
opencv = ">=4.9"
numpy = ">=1.26,<2"
pandas = ">=2.2"
scipy = ">=1.15"
scikit-learn = ">=1.7"
matplotlib = ">=3.10"
pillow = ">=10"
tqdm = ">=4.66"
pyyaml = ">=6.0"
flask = ">=3.0"
munch = ">=4.0"
requests = ">=2.32"
click = ">=7.1,<8.2"

[pypi-dependencies]
torch = {version = ">=2.11", index = "https://download.pytorch.org/whl/cu128"}
torchvision = {version = ">=0.26", index = "https://download.pytorch.org/whl/cu128"}
ultralytics = ">=8.3"
openai = ">=1.40"
yt-dlp = ">=2025.1"
edge-tts = ">=6.1"
gTTS = ">=2.5"
pydub = ">=0.25"
ollama = "*"
lap = ">=0.5"
einops = ">=0.8"
timm = ">=1.0"
transformers = ">=4.52"
accelerate = ">=1.0"
motmetrics = ">=1.4"
xmltodict = ">=0.14"
ipyfilechooser = ">=0.6"
